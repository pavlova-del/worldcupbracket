name: Scrape odds & deploy Pages

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay)
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # commit refreshed snapshots (persists prev->latest state)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape latest odds + fixtures (best-effort; Sportsbet may block CI IPs)
        run: python3 scrape_snapshot.py || echo "scrape failed (likely Sportsbet IP block) — deploying last committed snapshot"

      - name: Commit snapshot (persist state for next run's arrows)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/odds_latest.json docs/data/odds_prev.json docs/data/fixtures.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "odds snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
