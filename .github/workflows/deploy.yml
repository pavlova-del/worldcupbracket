name: Scrape odds (best-effort)

# Pages itself is served via "deploy from branch" (main /docs) — no deploy step
# needed here. Sportsbet blocks GitHub's cloud IPs (403), so this scrape usually
# can't fetch from CI; the live odds are refreshed by the LOCAL updater that
# pushes docs/data/*.json (see update_odds.sh). This job is kept best-effort in
# case the block is ever lifted.

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape odds (Sportsbet may block CI IPs)
        run: python3 scrape_snapshot.py || echo "odds scrape failed (likely Sportsbet IP block)"
      - name: Scrape results (ESPN — usually works from CI)
        run: python3 scrape_results.py || echo "results scrape failed"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/odds_latest.json docs/data/odds_prev.json docs/data/odds_history.json docs/data/fixtures.json docs/data/results.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "odds snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
