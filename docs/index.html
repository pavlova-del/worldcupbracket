<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World Cup 2026 · Sweepstake Tracker</title>
  <link rel="stylesheet" href="styles.css?v=20260623a" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <h1>WORLD CUP 2026</h1>
      <span class="tagline">Sweepstake tracker · live bracket &amp; odds</span>
    </div>
  </header>

  <nav id="ownerbar" aria-label="Filter by player"></nav>

  <div id="nextmatch" class="nextbox">Loading next match…</div>

  <main>
    <section id="bracketPanel" class="panel">
      <div class="tabs">
        <button class="tab active" data-view="groups">Groups</button>
        <button class="tab" data-view="table">Table</button>
        <button class="tab" data-view="knockout">Knockout</button>
        <button class="tab" data-view="schedule">Schedule</button>
        <button class="tab" data-view="sweeps">Sweepstake</button>
        <div class="legend" id="legend"></div>
      </div>
      <div id="groupsView" class="view"></div>
      <div id="tableView" class="view hidden"></div>
      <div id="knockoutView" class="view hidden"></div>
      <div id="scheduleView" class="view hidden"></div>
      <div id="sweepsView" class="view hidden"></div>
    </section>

    <aside id="oddsPanel" class="panel">
      <div class="otabs">
        <button class="otab active" data-otab="teams">Teams</button>
        <button class="otab" data-otab="players">Player slips</button>
        <button class="otab" data-otab="movers">Movers</button>
      </div>
      <div id="movers" class="movers"></div>
      <table id="teamTable" class="otable">
        <thead><tr><th>Seed</th><th>Team</th><th class="sparkh">Trend</th><th>Win</th><th>±</th></tr></thead>
        <tbody></tbody>
      </table>
      <table id="playerTable" class="otable hidden">
        <thead><tr><th>#</th><th>Player slip</th><th class="sparkh">Trend</th><th>Win</th><th>±</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="moversView" class="moversview hidden"></div>
      <div id="dataFoot" class="datafoot" aria-live="polite"></div>
    </aside>
  </main>

  <script src="app.js?v=20260623a"></script>
</body>
</html>
